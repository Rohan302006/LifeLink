<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>LifeLink</title>
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="95%">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.5" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#8b0a2b"/>
    </radialGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fff1f3"/>
      <stop offset="1" stop-color="#ffc9d3"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <clipPath id="round"><circle cx="256" cy="256" r="256"/></clipPath>
    <clipPath id="dropClip">
      <path id="dropShape" d="M256 78 C256 78 138 204 138 298 A118 118 0 0 0 374 298 C374 204 256 78 256 78 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4a0016" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
    <circle cx="256" cy="256" r="236" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="5"/>

    <!-- link line between two nodes (donor <-> receiver) -->
    <path d="M84 298 H212 L234 250 L270 348 L292 298 H428" fill="none" stroke="#fff" stroke-opacity="0.92" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="298" r="22" fill="#fff"/>
    <circle cx="84" cy="298" r="10" fill="#e11d48"/>
    <circle cx="428" cy="298" r="22" fill="#fff"/>
    <circle cx="428" cy="298" r="10" fill="#e11d48"/>

    <!-- blood drop -->
    <path d="M256 78 C256 78 138 204 138 298 A118 118 0 0 0 374 298 C374 204 256 78 256 78 Z" fill="url(#drop)" filter="url(#shadow)"/>
    <path d="M178 300 C178 244 214 190 252 130" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round" transform="translate(-6 0)"/>

    <!-- heartbeat inside drop -->
    <g clip-path="url(#dropClip)">
      <path d="M84 298 H212 L234 250 L270 348 L292 298 H428" fill="none" stroke="url(#pulse)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
