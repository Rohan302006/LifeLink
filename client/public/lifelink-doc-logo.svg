<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>LifeLink</title>
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#fff4f4"/>
      <stop offset="1" stop-color="#fbdcdc"/>
    </radialGradient>
    <radialGradient id="heart" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ff6b63"/>
      <stop offset="0.35" stop-color="#ec1c24"/>
      <stop offset="0.8" stop-color="#c10010"/>
      <stop offset="1" stop-color="#8a0008"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9ccd1"/>
      <stop offset="1" stop-color="#6f737a"/>
    </linearGradient>
    <linearGradient id="silverIn" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b8bcc2"/>
      <stop offset="1" stop-color="#7c8086"/>
    </linearGradient>
    <linearGradient id="tubeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55575c"/>
      <stop offset="1" stop-color="#1f2023"/>
    </linearGradient>
    <clipPath id="round"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <circle cx="256" cy="256" r="256" fill="url(#disc)"/>

    <g transform="translate(256 262) scale(0.8) translate(-282 -277)">
      <!-- light tube (right side) -->
      <path d="M235 380 C300 372 352 322 396 232 C414 192 392 172 374 186" fill="none" stroke="#9a9da3" stroke-width="15" stroke-linecap="round"/>
      <path d="M235 380 C300 372 352 322 396 232 C414 192 392 172 374 186" fill="none" stroke="#e9eaec" stroke-width="9" stroke-linecap="round"/>

      <!-- dark tube (left / bottom) -->
      <path d="M62 202 C38 305 72 425 192 442 C282 456 405 470 456 338" fill="none" stroke="url(#tubeDark)" stroke-width="15" stroke-linecap="round"/>
      <path d="M62 202 C38 305 72 425 192 442 C282 456 405 470 456 338" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" transform="translate(-2 -2)"/>

      <!-- heart -->
      <path d="M215 382 C120 300 50 235 50 165 C50 115 90 85 135 85 C170 85 200 100 215 125 C232 100 262 85 297 85 C345 85 378 118 378 165 C378 235 310 300 215 382 Z" fill="url(#heart)"/>
      <!-- inner rim light -->
      <path d="M215 366 C128 290 66 232 66 168" fill="none" stroke="#ff8a80" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
      <!-- gloss highlights -->
      <path d="M78 150 C78 118 104 100 135 100 C160 100 182 110 198 130 C150 120 108 130 78 170 Z" fill="url(#gloss)"/>
      <path d="M240 128 C256 108 278 100 300 100 C322 100 340 108 352 122 C320 116 276 118 240 128 Z" fill="url(#gloss)" opacity="0.7"/>

      <!-- earpiece -->
      <path d="M112 198 C92 172 56 172 48 204" fill="none" stroke="#9a9da3" stroke-width="12" stroke-linecap="round"/>
      <path d="M112 198 C92 172 56 172 48 204" fill="none" stroke="#f1f2f3" stroke-width="7" stroke-linecap="round"/>
      <circle cx="115" cy="198" r="15" fill="#1c1c1e"/>
      <ellipse cx="110" cy="192" rx="6" ry="4" fill="#fff" opacity="0.35"/>

      <!-- red bands -->
      <rect x="36" y="248" width="22" height="30" rx="4" fill="#d21f26" transform="rotate(-6 47 263)"/>
      <rect x="303" y="338" width="30" height="22" rx="4" fill="#d21f26" transform="rotate(-38 318 349)"/>

      <!-- chest piece -->
      <circle cx="460" cy="302" r="66" fill="#8f0f16"/>
      <circle cx="460" cy="298" r="64" fill="#e02a30"/>
      <circle cx="460" cy="302" r="50" fill="url(#silver)"/>
      <circle cx="460" cy="302" r="28" fill="url(#silverIn)"/>
      <circle cx="460" cy="302" r="28" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2"/>
    </g>

    <circle cx="256" cy="256" r="253" fill="none" stroke="#e8b9b9" stroke-width="6"/>
  </g>
</svg>
