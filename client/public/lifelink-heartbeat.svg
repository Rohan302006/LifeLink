<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>LifeLink</title>
  <defs>
    <radialGradient id="disc" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#fff3f3"/>
      <stop offset="1" stop-color="#fbd9d9"/>
    </radialGradient>
    <linearGradient id="heart" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8f1519"/>
      <stop offset="0.28" stop-color="#c8191f"/>
      <stop offset="0.5" stop-color="#e3121a"/>
      <stop offset="1" stop-color="#d00000"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dropG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd3d6"/>
    </linearGradient>
    <clipPath id="round"><circle cx="256" cy="256" r="256"/></clipPath>
    <clipPath id="heartClip">
      <path d="M256 440 C130 330 62 255 62 175 C62 112 108 72 162 72 C205 72 238 95 256 130 C274 95 307 72 350 72 C404 72 450 112 450 175 C450 255 382 330 256 440 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#5a0008" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <circle cx="256" cy="256" r="256" fill="url(#disc)"/>
    <circle cx="256" cy="256" r="249" fill="none" stroke="#e9b8b8" stroke-width="5"/>

    <!-- heart -->
    <path d="M256 440 C130 330 62 255 62 175 C62 112 108 72 162 72 C205 72 238 95 256 130 C274 95 307 72 350 72 C404 72 450 112 450 175 C450 255 382 330 256 440 Z" fill="url(#heart)" filter="url(#shadow)"/>

    <g clip-path="url(#heartClip)">
      <!-- glossy upper band -->
      <path d="M40 215 C140 262 372 262 472 215 L472 40 L40 40 Z" fill="url(#gloss)" opacity="0.55"/>
      <!-- bright lower body -->
      <path d="M40 232 C150 292 362 292 472 232 L472 480 L40 480 Z" fill="#ee0f14" opacity="0.55"/>
      <!-- top-left shine -->
      <ellipse cx="150" cy="118" rx="62" ry="26" fill="#fff" opacity="0.22" transform="rotate(-28 150 118)"/>
    </g>

    <!-- ECG line -->
    <path d="M84 232 H112 L130 155 L152 285 L170 215 L184 238 L196 238 L218 175 L240 280 L254 250 L268 250 L292 190 L312 278 L324 240 H370" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- small heart at the end of the pulse -->
    <path d="M404 264 C380 247 372 236 372 226 C372 217 379 211 387 211 C394 211 400 215 404 221 C408 215 414 211 421 211 C429 211 436 217 436 226 C436 236 428 247 404 264 Z" fill="#fff"/>

    <!-- blood drop with plus -->
    <path d="M256 312 C256 312 222 350 222 372 A34 34 0 0 0 290 372 C290 350 256 312 256 312 Z" fill="url(#dropG)"/>
    <rect x="243" y="368" width="26" height="8" rx="3" fill="#d0101a"/>
    <rect x="252" y="359" width="8" height="26" rx="3" fill="#d0101a"/>
  </g>
</svg>
